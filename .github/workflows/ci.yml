name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest tests -v

      # Future: sample data generation check
      # Enable once scripts/generate_sample_data.py exists.
      #
      # - name: Generate sample data
      #   run: uv run python scripts/generate_sample_data.py

      # Future: Streamlit import/smoke check
      # Enable once app/streamlit_app.py exists and streamlit is a project dependency.
      #
      # - name: Streamlit smoke check
      #   run: uv run python -m py_compile app/streamlit_app.py

